<style>
	* { margin: 0; padding: 0; box-sizing: border-box; }
	html, body { height: 100%; background: #0b0b0b; color: #e8e4dc; overflow: hidden; }
	body { display: flex; flex-direction: column; font: 13px Antonio, Oswald, "Arial Narrow", sans-serif; letter-spacing: 0.03em; }
	header { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 7px 14px; background: #1a1a19; border-bottom: 1px solid #2c2c2a; }
	header .group { display: flex; align-items: center; gap: 6px; }
	header .title { font-size: 18px; font-weight: 700; margin-right: 4px; }
	button, select, input { font: inherit; color: #e8e4dc; background: #2b2b29; border: 1px solid #44443f; border-radius: 4px; padding: 3px 9px; }
	button { cursor: pointer; }
	button:hover { background: #363633; }
	button.on { background: #6b231c; border-color: #a33a2e; }
	input[type=range] { padding: 0; width: 90px; accent-color: #c9483a; }
	#scale { width: 210px; }
	#patch-select { max-width: 190px; }
	#status { color: #8c8a84; flex: 1; min-width: 160px; text-align: right; }
	#help { color: #8c8a84; font-size: 12px; }
	canvas { flex: 1; display: block; width: 100%; min-height: 0; touch-action: none; }
</style>
</head>
<body>
<header>
	<span class="title">SUBHARM</span>
	<div class="group">
		<button id="power" title="Start / suspend the audio engine">Audio off</button>
	</div>
	<div class="group">
		Patch
		<select id="patch-select" title="Load a factory patch or one of your saved patches"></select>
		<button id="randomize" title="Roll a new random sound (keeps volume, compressor, reverb, cables and the loaded scale)">Randomize</button>
		<button id="patch-save" title="Save the panel and cables as a named patch in this browser">Save as&hellip;</button>
		<button id="patch-delete" title="Delete the selected saved patch" hidden>Delete</button>
		<button id="patch-export" title="Download the current patch as a .json file">Export</button>
		<button id="patch-import" title="Load a patch from a .json file">Import</button>
		<input id="patch-file" type="file" accept=".json,application/json" hidden />
	</div>
	<select id="add-synth" title="Insert a synth (Subharm, DRAM, Brother-32, Labyrinth), mixer, LFO, compressor, reverb or delay at the bottom of the rack"></select>
	<button id="wires" title="Show or hide the patch cables (the plugs stay on the jacks)">Wires: shown</button>
	<div class="group" title="Scale of the rack: 100% fills the window width">
		Zoom
		<button id="zoom-out" title="Smaller">&minus;</button>
		<button id="zoom-reset" title="Back to the window width">100%</button>
		<button id="zoom-in" title="Bigger">+</button>
	</div>
	<button id="rear" title="Turn the rack around: the audio connections between the devices (Tab)">Rear (Tab)</button>
	<button id="layout" title="Switch between the hardware panel layout and the classic layout">Layout</button>
	<div class="group">
		Scale
		<input id="scale" list="scale-list" placeholder="loading scales&hellip;" spellcheck="false" />
		<datalist id="scale-list"></datalist>
		<button id="scale-clear" title="Remove the custom scale">&times;</button>
	</div>
	<span id="help" title="Drag knobs vertically (Shift = fine), double-click resets. Drag from a jack to patch, double-click or right-click a jack to unplug. The mouse wheel off a knob scrolls the rack (Shift + wheel: sideways). Tab turns the rack around (rear view with the audio connections). Keys: Space play / stop every synth, R reset, N next, T trigger (when QWERTY is on in the keys device, T plays F#).">? help</span>
	<span id="status"></span>
</header>
<canvas id="panel"></canvas>
<script src="webrack.js?v=20261016m"></script>
<!-- synths: each registers itself in the rack (panel here, DSP in its -worklet.js) -->
<script src="devices/subharm.js?v=20261016m"></script>
<script src="devices/dram.js?v=20261016m"></script>
<script src="devices/b32.js?v=20261016m"></script>
<script src="devices/labyrinth.js?v=20261016m"></script>
<script src="devices/mixer.js?v=20261016m"></script>
<script src="devices/lfo.js?v=20261016m"></script>
<script src="devices/comp.js?v=20261016m"></script>
<script src="devices/reverb.js?v=20261016m"></script>
<script src="devices/delay.js?v=20261016m"></script>
<script src="code.js?v=20261016m"></script>
</body>
</html>
