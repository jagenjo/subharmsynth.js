<style>
	* { margin: 0; padding: 0; box-sizing: border-box; }
	html, body { height: 100%; background: #0b0b0b; color: #e8e4dc; overflow: hidden; }
	body { display: flex; flex-direction: column; font: 13px Antonio, Oswald, "Arial Narrow", sans-serif; letter-spacing: 0.03em; }
	header { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 7px 14px; background: #1a1a19; border-bottom: 1px solid #2c2c2a; }
	header .group { display: flex; align-items: center; gap: 6px; }
	header .title { font-size: 18px; font-weight: 700; margin-right: 4px; }
	button, select, input { font: inherit; color: #e8e4dc; background: #2b2b29; border: 1px solid #44443f; border-radius: 4px; padding: 3px 9px; }
	button { cursor: pointer; }
	button:hover { background: #363633; }
	button.on { background: #6b231c; border-color: #a33a2e; }
	input[type=range] { padding: 0; width: 90px; accent-color: #c9483a; }
	#scale { width: 210px; }
	#patch-select { max-width: 190px; }
	#status { color: #8c8a84; flex: 1; min-width: 160px; text-align: right; }
	#help { color: #8c8a84; font-size: 12px; }
	canvas { flex: 1; display: block; width: 100%; min-height: 0; touch-action: none; }
	#seq { flex: none; height: 30px; border-top: 1px solid #2c2c2a; }
	#options-wrap, #sessions-wrap { position: relative; }
	#options-panel[hidden], #sessions-panel[hidden] { display: none; } /* their display: flex would beat the hidden attribute */
	#sessions-panel { position: absolute; top: calc(100% + 6px); left: 0; z-index: 10; width: 460px; max-width: 92vw; padding: 10px 12px;
		background: #1f1f1d; border: 1px solid #44443f; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,0.5); }
	#sessions-panel .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: #8c8a84; }
	#sessions-panel .reopen { display: flex; align-items: center; gap: 8px; margin: 8px 0; cursor: pointer; }
	#sessions-panel .reopen input { accent-color: #c9483a; width: 15px; height: 15px; margin: 0; padding: 0; }
	#sessions-panel .list { max-height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
	#sessions-panel .item { display: flex; gap: 10px; align-items: center; padding: 7px 9px; background: #262624; border-radius: 4px; border-left: 3px solid #44443f; }
	#sessions-panel .item.current { border-left-color: #c9483a; }
	#sessions-panel .info { flex: 1; min-width: 0; }
	#sessions-panel .name { font-size: 14px; }
	#sessions-panel .tag { font-size: 10px; color: #fff; background: #a33a2e; border-radius: 3px; padding: 0 4px; }
	#sessions-panel .meta { color: #8c8a84; font-size: 11px; }
	#sessions-panel .sum { color: #b6b3ab; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	#sessions-panel .acts { display: flex; gap: 4px; flex: none; }
	#sessions-panel .empty { color: #8c8a84; padding: 8px 0; }
	#options-panel { position: absolute; top: calc(100% + 6px); left: 0; z-index: 10; min-width: 270px; padding: 10px 12px;
		display: flex; flex-direction: column; gap: 10px; background: #1f1f1d; border: 1px solid #44443f; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,0.5); }
	#options-panel .row { display: flex; align-items: center; gap: 8px; }
	#options-panel .label { color: #8c8a84; min-width: 52px; }
	#options-panel label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
	#options-panel input[type=checkbox], #options-panel input[type=radio] { accent-color: #c9483a; width: 15px; height: 15px; margin: 0; padding: 0; }
</style>
</head>
<body>
<header>
	<span class="title">SYNTHS</span>
	<div class="group">
		<button id="power" title="Start / suspend the audio engine">Audio off</button>
	</div>
	<div id="sessions-wrap">
		<button id="sessions" title="Your sessions, saved automatically in this browser">Sessions &#9662;</button>
		<div id="sessions-panel" hidden></div>
	</div>
	<div class="group">
		Patch
		<select id="patch-select" title="Load a factory patch or one of your saved patches"></select>
		<button id="randomize" title="Roll a new random sound (keeps volume, compressor, reverb, cables and the loaded scale)">Randomize</button>
		<button id="patch-save" title="Save the panel and cables as a named patch in this browser">Save as&hellip;</button>
		<button id="patch-delete" title="Delete the selected saved patch" hidden>Delete</button>
		<button id="patch-export" title="Download the current patch as a .json file">Export</button>
		<button id="patch-import" title="Load a patch from a .json file">Import</button>
		<input id="patch-file" type="file" accept=".json,application/json" hidden />
	</div>
	<select id="add-synth" title="Insert a synth (Subharm, DRAM, Brother-32, Maze, Mystic, LLM Dram), mixer, LFO, compressor, reverb or delay at the bottom of the rack"></select>
	<div class="group" title="Scale of the rack: 100% fills the window width">
		Zoom
		<button id="zoom-out" title="Smaller">&minus;</button>
		<button id="zoom-reset" title="Back to the window width">100%</button>
		<button id="zoom-in" title="Bigger">+</button>
	</div>
	<button id="rear" title="Turn the rack around: the audio connections between the devices (Tab)">Rear (Tab)</button>
	<div id="options-wrap">
		<button id="options" title="Layout, wires and mouse wheel">Options &#9662;</button>
		<div id="options-panel" hidden>
			<div class="row">
				<span class="label">Layout</span>
				<label title="The Subharm laid out like the real front panel"><input type="radio" name="opt-layout" value="hardware" /> Hardware</label>
				<label title="The original compact layout of the Subharm"><input type="radio" name="opt-layout" value="classic" /> Classic</label>
			</div>
			<label title="Hide the cables and keep only their plugs on the jacks"><input type="checkbox" id="opt-wires" /> Show wires</label>
			<label title="Off: the mouse wheel always scrolls the rack, even over a knob or a fader"><input type="checkbox" id="opt-wheel" /> Mouse wheel turns the knob under the cursor</label>
		</div>
	</div>
	<div class="group">
		Scale
		<input id="scale" list="scale-list" placeholder="loading scales&hellip;" spellcheck="false" />
		<datalist id="scale-list"></datalist>
		<button id="scale-clear" title="Remove the custom scale">&times;</button>
	</div>
	<span id="help" title="Drag knobs vertically (Shift = fine), double-click resets. Drag from a jack to patch, double-click or right-click a jack to unplug. The mouse wheel over a knob turns it (Options can turn that off), elsewhere it scrolls the rack (Shift + wheel: sideways). Tab turns the rack around (rear view with the audio connections). Keys: Space play / stop every synth, R reset, N next, T trigger (when QWERTY is on in the keys device, T plays F#).">? help</span>
	<span id="status"></span>
</header>
<canvas id="panel"></canvas>
<canvas id="seq"></canvas>
<script src="webrack.js?v=20261017j"></script>

<script src="devices/mystic.js?v=20261017j"></script>
<script src="devices/llmdram.js?v=20261017j"></script>
<script src="devices/mixer.js?v=20261017j"></script>
<script src="devices/lfo.js?v=20261017j"></script>
<script src="devices/comp.js?v=20261017j"></script>
<script src="devices/reverb.js?v=20261017j"></script>
<script src="devices/delay.js?v=20261017j"></script>
<script src="devices/universe.js?v=20261017j"></script>
<script src="devices/hyper.js?v=20261017j"></script>
<script src="code.js?v=20261017j"></script>
<script src="sequencer.js?v=20261017j"></script>
<script src="sessions.js?v=20261017j"></script>
</body>
</html>
